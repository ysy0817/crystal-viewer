# ==============================================================================
# 晶体结构演示程序 —— 主配置文件
# ------------------------------------------------------------------------------
# 所有可调参数都在这里，改完保存后重新运行即可，不需要动任何 .py 文件。
#
# 语法要点：
#   - 冒号后必须有空格，例如 "line_width: 2"
#   - 用 # 开头写注释
#   - 布尔值写 true / false（小写）
#   - 颜色用 0xRRGGBB 十六进制，例如 0xFFFFFF 是白色
#
# 密钥请写到同目录的 keys.yaml（本文件里的密钥字段一律留空）：
#          keys.yaml 已被 .gitignore 忽略，不会出现在仓库里。
#         首次使用：copy keys.example.yaml keys.yaml，再填自己的 Key。
# 环境变量：CRYSTAL_SECTION__KEY=值 可覆盖任意参数，
#          例如 CRYSTAL_RENDER__LINE_WIDTH=4、CRYSTAL_ASR__API_KEY=xxx。
# ==============================================================================

# ------------------------------------------------------------------------------
# 窗口
# ------------------------------------------------------------------------------
window:
  width: 1920           # 初始窗口宽度（像素）
  height: 1080          # 初始窗口高度（像素）
  title: 晶体结构演示     # 窗口标题
  resizable: true       # 是否允许拖动改变窗口大小
  fullscreen: false     # 是否全屏
  background: black     # 背景色，可用颜色名或 0xRRGGBB
  fps: 60               # 帧率上限

# ------------------------------------------------------------------------------
# 渲染（线条、原子、文字的大小与配色）
# ------------------------------------------------------------------------------
render:
  scale: 100            # 晶胞缩放系数：晶格坐标乘以该值得到像素尺寸
  line_width: 2         # 晶胞棱线宽度
  point_radius: 5       # 原子（顶点）圆点半径
  font_name: simhei     # 字体名；Linux/macOS 请改成系统里存在的中文字体
  font_size: 24         # 模型名称字号
  label_flip_vertical: true   # 名称上下翻转后再旋转，字形呈镜像 —— 这是原本的设计效果，勿轻易改

  # 正常配色与切换模型时的渐变效果
  line_color: 0xFFFFFF  # 棱线正常颜色
  point_color: 0xFF0000 # 原子正常颜色
  text_color: 0xFFFFFF  # 文字正常颜色
  line_fade_step: 0x111111   # 棱线每次渐变的色阶步长（数值越大闪得越快）
  point_fade_step: 0x110000  # 原子渐变色阶步长
  text_fade_step: 0x111111   # 文字渐变色阶步长

# ------------------------------------------------------------------------------
# 四视图布局与旋转
#   程序会把同一个晶胞画四次，形成"环绕"的立体观感。
#   offset          视图中心相对屏幕中心的偏移（像素）
#   label_offset    模型名称相对视图中心的偏移（像素）
#   label_rotation  模型名称的旋转角度（度），0/90/180/270
#   initial_rotation 该视图晶胞的初始姿态
#   spin            每帧自动旋转的轴与角度（度）
#   oblique         斜投影矩阵：绕某轴倾斜，让立方体有立体感
# ------------------------------------------------------------------------------
views:
  - offset: [300, 0]
    label_offset: [350, 0]
    label_rotation: 90
    initial_rotation: { axis: z, deg: 0 }
    spin: { axis: x, deg: 2 }
    oblique: { axis: y, deg: 30 }
  - offset: [-300, 0]
    label_offset: [-350, 0]
    label_rotation: 270
    initial_rotation: { axis: z, deg: 180 }
    spin: { axis: x, deg: 2 }
    oblique: { axis: y, deg: -30 }
  - offset: [0, 300]
    label_offset: [0, 185]
    label_rotation: 0
    initial_rotation: { axis: z, deg: 270 }
    spin: { axis: y, deg: 2 }
    oblique: { axis: x, deg: 30 }
  - offset: [0, -300]
    label_offset: [0, -185]
    label_rotation: 0
    initial_rotation: { axis: z, deg: 90 }
    spin: { axis: y, deg: 2 }
    oblique: { axis: x, deg: -30 }

# ------------------------------------------------------------------------------
# 键盘操作
# ------------------------------------------------------------------------------
keyboard:
  enabled: true
  quit_key: escape      # 退出程序的按键
  model_keys: [f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11]  # 依次对应晶胞列表顺序
  voice_key: null       # 按该键触发一次语音识别，null 表示不绑定（默认由 MQTT 触发）

# ------------------------------------------------------------------------------
# 手势识别（摄像头 + MediaPipe）
#   通过手腕在画面中的横向移动来切换晶胞。
# ------------------------------------------------------------------------------
gesture:
  enabled: true
  camera_index: 0           # 摄像头编号，0 通常是内置摄像头
  mirror: false             # 画面是否需要左右镜像
  landmark: 15              # 用于判断的手部关键点编号（15 = 左手腕）
  min_visibility: 0.8       # 关键点可见度下限，低于此值忽略该帧
  warmup_frames: 10         # 启动后累计多少帧才开始响应，防止误触发
  move_scale: 10            # 位移放大倍数（把手部横向比例换算成像素）
  switch_threshold: 2.0     # 位移超过该阈值即切换，越小越灵敏
  show_window: true         # 是否弹出摄像头画面窗口

# ------------------------------------------------------------------------------
# 语音识别（百度语音，需要 API Key）
#   识别结果匹配 next_phrases / prev_phrases 后切换晶胞。
# ------------------------------------------------------------------------------
voice:
  enabled: true
  duration: 5               # 录音时长（秒）
  sample_rate: 16000        # 采样率，百度极速版固定 16000
  channels: 1               # 声道数
  chunk_size: 1024          # 每次读取的音频块大小
  audio_file: output.wav    # 临时录音文件（相对项目根目录）
  next_phrases: [下一个, 下一张, 下一个。]   # 命中任意一个即"下一个"
  prev_phrases: [上一个, 上一张, 上一个。]   # 命中任意一个即"上一个"

# 百度语音识别参数
asr:
  dev_pid: 1537             # 1537 = 普通话输入法模型，其他语种见百度文档
  url: http://vop.baidu.com/server_api
  scope: audio_voice_assistant_get
  api_key: ""               # 留空，去 keys.yaml 里填
  secret_key: ""            # 留空，去 keys.yaml 里填
  cuid: "117158949"         # 用户唯一标识，可随意填一串数字

# ------------------------------------------------------------------------------
# 语音合成（百度语音，用于"介绍当前晶胞"功能）
# ------------------------------------------------------------------------------
tts:
  enabled: true
  spd: 5                    # 语速 0-15
  pit: 5                    # 音调 0-15
  vol: 5                    # 音量 0-15
  per: 5003                 # 发音人，5003 = 度逍遥
  lan: zh                   # 语言
  aue: 3                    # 3 = mp3
  url: https://tsn.baidu.com/text2audio
  api_key: ""               # 留空，去 keys.yaml 里填
  secret_key: ""            # 留空，去 keys.yaml 里填
  cuid: "Vlw1AHr92vqnaLUH8iqwedfUM3ITilDV"

# ------------------------------------------------------------------------------
# MQTT（可选：用 DFRobot IoT 平台或手机 APP 远程遥控）
#   收到命令字符串后执行对应动作。
# ------------------------------------------------------------------------------
mqtt:
  enabled: true
  host: iot.dfrobot.com.cn
  port: 1883
  topic: ""               # 留空，去 keys.yaml 里填
  username: ""            # 留空，去 keys.yaml 里填
  password: ""            # 留空，去 keys.yaml 里填
  keepalive: 60
  commands:
    next: "+1"              # 切换到下一个晶胞
    previous: "-1"          # 切换到上一个晶胞
    listen: "turn"          # 触发一次语音识别，例如说"下一个"
    introduce: "introduce"  # 语音介绍当前晶胞

# ------------------------------------------------------------------------------
# 晶胞清单文件（默认为项目根目录下的 models.yaml）
# ------------------------------------------------------------------------------
models_file: models.yaml

# ------------------------------------------------------------------------------
# 数据目录（相对项目根目录）
# ------------------------------------------------------------------------------
data:
  lattice: data/lattice/unit_cell_points.csv
  edges_dir: data/edges
  intro_dir: data/intro
