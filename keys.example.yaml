# ==============================================================================
# 密钥配置模板
# ------------------------------------------------------------------------------
# 使用方法：
#   1. 复制本文件为 keys.yaml
#        Windows:      copy keys.example.yaml keys.yaml
#        macOS/Linux:  cp keys.example.yaml keys.yaml
#   2. 把下面各项填成自己申请的值，保存后重新运行程序
#
# keys.yaml 已被 .gitignore 忽略，不会提交到仓库。
# 某一项留空时，对应功能会自动关闭并在启动日志里给出提示，
# 不影响键盘切换晶胞等核心功能。
# 也可以改用环境变量：CRYSTAL_ASR__API_KEY=xxx 等，见 README。
# ==============================================================================

# 百度语音识别 —— 用于"下一个 / 上一个"语音指令
asr:
  api_key: ""
  secret_key: ""

# 百度语音合成 —— 用于朗读晶胞介绍
tts:
  api_key: ""
  secret_key: ""

# DFRobot IoT 平台 MQTT —— 用于手机远程遥控
mqtt:
  topic: ""
  username: ""
  password: ""
